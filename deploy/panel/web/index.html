<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANS-GO 管理面板</title>
<script src="static/qrcode.min.js"></script>
<style>
  /* 暗黑（默认）*/
  :root,[data-theme="dark"]{--bg:#0f1419;--card:#1a2029;--card2:#222b36;--txt:#d4dae0;--mut:#8b97a3;--acc:#3b82f6;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--bd:#2d3744;--hover:#2f3a47}
  /* 白天 */
  [data-theme="light"]{--bg:#f5f7fa;--card:#ffffff;--card2:#eef2f7;--txt:#1a2029;--mut:#6b7785;--acc:#2563eb;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--bd:#d8dee8;--hover:#e2e8f0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;transition:background .2s,color .2s}
  a{color:var(--acc);text-decoration:none}
  button{cursor:pointer;font-family:inherit;font-size:13px;border:none;border-radius:6px;padding:7px 14px;background:var(--card2);color:var(--txt);transition:.15s}
  button:hover{background:var(--hover)}
  button.primary{background:var(--acc);color:#fff}
  button.primary:hover{background:var(--acc);opacity:.9}
  button.danger{background:var(--err);color:#fff}
  button.danger:hover{background:var(--err);opacity:.9}
  button.ok{background:var(--ok);color:#fff}
  input,select{font-family:inherit;font-size:13px;background:var(--card2);border:1px solid var(--bd);color:var(--txt);border-radius:6px;padding:7px 10px;width:100%}
  input:focus{outline:none;border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
  .card h3{font-size:14px;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .mut{color:var(--mut)}
  /* login */
  #login{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .login-box{width:340px;max-width:90vw}
  .login-box h1{font-size:20px;text-align:center;margin-bottom:6px}
  .login-box .sub{text-align:center;color:var(--mut);margin-bottom:20px;font-size:12px}
  .login-box button{width:100%;margin-top:8px;padding:9px}
  .login-err{color:var(--err);font-size:12px;margin-top:8px;min-height:16px;text-align:center}
  .forgot{margin-top:14px;font-size:12px;color:var(--mut);text-align:center}
  .forgot code{background:var(--card2);padding:2px 6px;border-radius:4px;color:var(--warn)}
  /* app layout: topbar + (sidebar + content) */
  #app{display:none;flex-direction:column;min-height:100vh}
  .topbar{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;flex-shrink:0}
  .topbar-left{display:flex;align-items:center;gap:10px}
  .topbar .brand{font-weight:600;font-size:15px}
  .menu-btn{display:none;background:transparent;font-size:18px;padding:6px 9px;line-height:1}
  .main-wrap{display:flex;flex:1;min-height:0}
  .sidebar{width:200px;background:var(--card);border-right:1px solid var(--bd);flex-shrink:0;display:flex;flex-direction:column;padding:8px 0 12px;overflow:hidden hidden;transition:width .2s ease}
  .sidebar.collapsed{width:58px}
  .collapse-btn{margin:0 10px 8px;background:transparent;color:var(--mut);padding:7px;border-radius:6px;text-align:center;font-size:13px}
  .collapse-btn:hover{background:var(--hover);color:var(--txt)}
  .nav{display:flex;flex-direction:column;gap:2px;padding:0 8px;overflow-y:auto;overflow-x:hidden;flex:1}
  .nav button{display:flex;align-items:center;gap:10px;background:transparent;border:none;border-radius:6px;padding:9px 12px;color:var(--mut);text-align:left;width:100%;font-size:13px;transition:.15s}
  .nav button:hover{background:var(--hover);color:var(--txt)}
  .nav button .ico{font-size:15px;flex-shrink:0;width:22px;text-align:center;line-height:1}
  .nav button .label{flex:1;white-space:nowrap;overflow:hidden}
  .nav button.active{background:var(--acc);color:#fff}
  .nav button.active:hover{background:var(--acc);color:#fff;opacity:.92}
  .sidebar.collapsed .nav button{justify-content:center;padding:9px 0}
  /* v1.5.22: 侧栏底部版本号（常驻可见，方便核实升级是否生效） */
  .side-footer{padding:8px 14px 2px;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--bd);margin-top:4px}
  .side-footer #verTag{font-weight:600;color:var(--acc)}
  .sidebar.collapsed .side-footer{padding:8px 0 2px;text-align:center;font-size:9px}
  .sidebar.collapsed .side-footer #verTag{display:block}
  .sidebar.collapsed .nav button .label,.sidebar.collapsed .collapse-btn .lbl{display:none}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
  .content{flex:1;padding:18px;overflow:auto;max-width:1100px;margin:0 auto;width:100%}
  /* 滚动条美化（侧边栏长导航） */
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
  .grid{display:grid;gap:12px}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:760px){.grid.g4,.grid.g3,.grid.g2{grid-template-columns:1fr}}
  .stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px}
  .stat .lbl{color:var(--mut);font-size:12px;margin-bottom:6px}
  .stat .val{font-size:18px;font-weight:600;color:var(--txt)}
  .stat .sub{font-size:11px;color:var(--mut);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left}
  th{color:var(--mut);font-weight:500;font-size:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok)} .dot.off{background:var(--err)} .dot.unk{background:var(--mut)}
  /* v1.5.20: 顶栏管理面板状态圆点（紧贴用户名右侧，纯展示，hover 显示状态+端口） */
  #panelDot{margin:0 10px 0 4px;width:9px;height:9px;cursor:default;transition:background .2s}
  .uri-box{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:10px;font-family:monospace;font-size:12px;word-break:break-all;margin:8px 0}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .row label{width:120px;color:var(--mut);font-size:12px;flex-shrink:0}
  .row .f{flex:1}
  /* 输入框行内 + 右侧 🎲 随机按钮（v1.5.18） */
  .field-inline{display:flex;gap:6px;align-items:center}
  .field-inline input,.field-inline select{flex:1;min-width:0}
  .field-inline .dice{flex-shrink:0;padding:7px 10px;line-height:1}
  /* 服务卡操作行（应用/启停/重启/装卸/检测 一行，移动端自动换行） */
  .ops-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .node-card{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .node-card .info{flex:1;min-width:240px}
  .node-card .qr{width:150px;text-align:center}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);padding:10px 18px;border-radius:8px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
  .overlay .box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:30px;text-align:center;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .overlay .box h2{margin-bottom:10px}
  .overlay .count{font-size:48px;font-weight:700;color:var(--acc);margin:14px 0}
  .help{font-size:11px;color:var(--mut);margin-top:6px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--mut)}
  code{color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* 日志区：始终深底浅字（日志终端风格，双主题统一） */
  .logs{background:#0a0e12;border:1px solid var(--bd);border-radius:6px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;max-height:480px;overflow:auto;white-space:pre-wrap;color:#9fb3c8}
  /* ===== 响应式（必须置于所有基础规则之后，否则同特异性会被后面的基础规则覆盖） ===== */
  @media(max-width:760px){
    html,body{-webkit-text-size-adjust:100%}
    .topbar{padding:8px 12px;flex-wrap:wrap;gap:6px}
    .topbar .brand{font-size:14px}
    .menu-btn{display:inline-block}
    .main-wrap{position:relative}
    /* 移动端：侧边栏变抽屉，默认收起 */
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 12px rgba(0,0,0,.3)}
    .sidebar.open{transform:translateX(0)}
    .sidebar.collapsed{width:220px}
    .sidebar.collapsed .nav button .label,.sidebar.collapsed .collapse-btn .lbl{display:inline}
    .sidebar.collapsed .nav button{justify-content:flex-start;padding:9px 12px}
    .sidebar-overlay.show{display:block}
    .collapse-btn{display:none}
    .content{padding:12px 10px;max-width:100%}
    .row{flex-wrap:wrap}
    .row label{flex:1 0 100%;margin-bottom:4px}
    .row>button{margin-top:6px}
  }
  @media(max-width:560px){
    body{font-size:13px}
    .card{padding:12px}
    .login-box{width:100%}
    .stat{padding:10px}
    .stat .val{font-size:15px}
    .grid{gap:8px}
    table{font-size:12px}
    td,th{padding:6px}
    button{padding:8px 12px}
    .node-card .info{min-width:100%}
    .node-card .qr{width:100%;margin-top:12px}
    .node-card .qr>div{display:flex;justify-content:center}
    .node-card .qr .help{text-align:center}
    .uri-box{font-size:11px}
    .overlay .box{padding:20px;margin:0 12px}
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login">
  <div class="login-box card">
    <h1>🔒 ANS-GO 管理面板</h1>
    <div class="sub">请输入管理员账号</div>
    <div class="row" style="margin-bottom:8px"><input id="lu" placeholder="用户名" autocomplete="username"></div>
    <div class="row" style="margin-bottom:8px"><input id="lp" type="password" placeholder="密码" autocomplete="current-password"></div>
    <button class="primary" onclick="doLogin()">登 录</button>
    <div class="login-err" id="lerr"></div>
    <div class="forgot">忘记密码？SSH 执行 <code>ansgo-admin panel-pass</code> 重置</div>
  </div>
</div>

<!-- 应用 -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" onclick="toggleSidebar()" title="菜单">☰</button>
      <div class="brand">⚡ ANS-GO 管理面板</div>
    </div>
    <div><span class="mut" id="topuser"></span><span id="panelDot" class="dot unk" title="管理面板状态加载中…"></span><button id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button> <button onclick="doLogout()">退出</button></div>
  </div>
  <div class="main-wrap">
    <aside class="sidebar" id="sidebar">
      <button class="collapse-btn" onclick="toggleCollapse()" title="折叠/展开"><span id="collapseIco">◀</span> <span class="lbl" id="collapseLbl">折叠</span></button>
      <nav class="nav" id="nav">
        <button data-t="dash" class="active" onclick="showTab('dash')"><span class="ico">📊</span><span class="label">仪表盘</span></button>
        <button data-t="node" onclick="showTab('node')"><span class="ico">🌐</span><span class="label">节点信息</span></button>
        <button data-t="mgmt" onclick="showTab('mgmt')"><span class="ico">🗂️</span><span class="label">服务管理</span></button>
        <button data-t="landing" onclick="showTab('landing')"><span class="ico">🛬</span><span class="label">落地服务</span></button>
        <button data-t="cert" onclick="showTab('cert')"><span class="ico">📜</span><span class="label">证书管理</span></button>
        <button data-t="set" onclick="showTab('set')"><span class="ico">⚙️</span><span class="label">面板设置</span></button>
        <button data-t="log" onclick="showTab('log')"><span class="ico">📃</span><span class="label">日志</span></button>
      </nav>
      <div class="side-footer" id="sideFooter">ANS-GO <span id="verTag">v-</span></div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="box" id="obox"></div></div>

<script>
const $=s=>document.querySelector(s);
// fetch 封装：网络异常时也返回 {error} 而非抛出，避免调用处未 catch 导致「静默无反应」
const api=async(p,o={})=>{try{const r=await fetch(p,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},o));const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j={error:t||('HTTP '+r.status)}}if(!r.ok&&!j.error)j.error='HTTP '+r.status;return j}catch(e){return {error:'请求失败: '+e.message}}};
// 简易日志：任何未捕获异常都打到控制台 + toast，绝不静默
window.addEventListener('error',e=>{console.error('[BV]',e.message,e);toast('脚本错误: '+e.message)});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('已复制到剪贴板'),()=>toast('复制失败'))}
function dot(s){const c=s==='active'?'on':(s==='inactive'||s==='failed')?'off':'unk';return `<span class="dot ${c}"></span>${s}`}
async function checkAuth(){
  const j=await api('api/auth');
  // v1.5.22: 侧栏底部显示面板版本号（来自后端 -ldflags 注入），方便核实升级是否生效
  if(j.version){const vt=$('#verTag');if(vt)vt.textContent='v'+j.version}
  if(j.authed){$('#topuser').textContent='👤 '+j.user;showApp();showTab('dash');refreshPanelDot()}
  else{$('#login').style.display='flex';$('#app').style.display='none';$('#lu').focus()}
}
async function doLogin(){
  const u=$('#lu').value.trim(),p=$('#lp').value;
  $('#lerr').textContent='登录中…';
  $('#lerr').style.color='var(--mut)';
  try{
    const j=await api('api/login',{method:'POST',body:JSON.stringify({user:u,pass:p})});
    $('#lerr').style.color='var(--err)';
    if(j.ok){$('#topuser').textContent='👤 '+(u||'admin');showApp();showTab('dash')}
    else $('#lerr').textContent=j.error||'登录失败';
  }catch(e){$('#lerr').style.color='var(--err)';$('#lerr').textContent='登录异常: '+e.message;console.error(e)}
}
async function doLogout(){await api('api/logout',{method:'POST'});location.reload()}
function showApp(){$('#login').style.display='none';$('#app').style.display='flex'}
// v1.5.20: 刷新顶栏管理面板状态圆点（绿=运行中/红=未运行/灰=获取失败），title 显示状态+端口
// 仅登录后 app 可见时执行；fire-and-forget，失败不阻塞调用方
async function refreshPanelDot(){
  const el=$('#panelDot');
  if(!el)return;
  const j=await api('api/dashboard');
  if(j.error){el.className='dot unk';el.title='管理面板状态获取失败';return}
  const active=(j.services||{}).panel==='active';
  el.className='dot '+(active?'on':'off');
  el.title='管理面板：'+(active?'运行中':'未运行')+' :'+(j.ports||{}).panel;
}
function showTab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  ({dash:loadDash,node:loadNode,svc:loadSvc,mgmt:loadMgmt,install:loadInstall,port:loadPort,key:loadKey,landing:loadLanding,cert:loadCert,set:loadSet,log:loadLog}[t]||loadDash)();
  closeSidebar();  // 移动端选页后收起抽屉（桌面端 no-op）
  refreshPanelDot()  // v1.5.20: 切 tab 时静默刷新顶栏管理面板状态（fire-and-forget，不阻塞页面加载）
}
// 侧边栏：桌面端折叠/展开（记忆），移动端开关抽屉
function isMobile(){return window.matchMedia('(max-width:760px)').matches}
function toggleSidebar(){const s=$('#sidebar');s.classList.toggle('open');$('#sidebarOverlay').classList.toggle('show',s.classList.contains('open'))}
function closeSidebar(){const s=$('#sidebar');s.classList.remove('open');$('#sidebarOverlay').classList.remove('show')}
function toggleCollapse(){
  if(isMobile())return;  // 移动端不折叠（走抽屉）
  const s=$('#sidebar');s.classList.toggle('collapsed');
  const c=s.classList.contains('collapsed');
  $('#collapseIco').textContent=c?'▶':'◀';
  $('#collapseLbl').textContent=c?'展开':'折叠';
  localStorage.setItem('ansgo_sidebar',c?'collapsed':'expanded')
}

// 仪表盘
async function loadDash(){
  $('#content').innerHTML='<div class="mut">加载中…</div>';
  const j=await api('api/dashboard');
  if(j.error)return $('#content').innerHTML='<div class="card">'+j.error+'</div>';
  const cert=j.cert||{};
  const memPct=j.mem.total?Math.round(j.mem.used/j.mem.total*100):0;
  // 服务状态卡（带检测按钮）
  const svcCard=(label,key,portTarget)=>`<div class="stat">
     <div class="lbl">${label}</div>
     <div class="val" style="font-size:14px">${dot(j.services[key])}</div>
     <div class="sub">:${j.ports[key]||''}</div>
     <button class="mut" style="margin-top:6px;font-size:11px;padding:4px 10px" onclick="checkHealth('${portTarget}',this)">🔍 检测</button>
     <div id="health-${portTarget}"></div></div>`;
  $('#content').innerHTML=`
   <div class="grid g4">
     ${svcCard('AnyTLS','anytls','anytls')}
     ${svcCard('NaiveProxy','naive','naive')}
     ${svcCard('Shadowsocks','ss','ss')}
     ${svcCard('SOCKS5','socks','socks')}
   </div>
   <div class="grid g4" style="margin-top:12px">
     <div class="stat"><div class="lbl">内存占用</div><div class="val">${memPct}%</div><div class="sub">${Math.round(j.mem.used/1024)} / ${Math.round(j.mem.total/1024)} MB</div></div>
     <div class="stat"><div class="lbl">系统负载</div><div class="val">${(j.load||[]).map(x=>x.toFixed(2)).join(' ')}</div></div>
     <div class="stat"><div class="lbl">运行时长</div><div class="val">${Math.round(j.uptime)}h</div></div>
     <div class="stat"><div class="lbl">TCP 连接</div><div class="val">${j.tcp}</div></div>
   </div>
   <div class="card"><h3>📜 证书状态</h3>
     <table><tr><th>域名</th><td>${cert.subject||'-'}</td></tr>
     <tr><th>签发机构</th><td>${cert.issuer_org||cert.issuer||'-'}</td></tr>
     <tr><th>有效期</th><td>${cert.not_before||'-'} ~ ${cert.not_after||'-'}</td></tr>
     <tr><th>剩余天数</th><td><b style="color:${cert.days_left<14?'var(--err)':'var(--ok)'}">${cert.days_left??'-'}</b> 天</td></tr></table>
   </div>`;
}

// 节点信息（v1.5.12 重构：未启用的服务不显示；每条信息独立一行 + 复制按钮）
async function loadNode(){
  $('#content').innerHTML='<div class="mut">加载中…</div>';
  const j=await api('api/node');
  if(j.error)return $('#content').innerHTML=j.error;
  const domain=j.domain||'';
  const serverIp=j.server_ip||'';       // v1.5.18：连接地址优先显示服务器 IP，回退域名
  const hint=j.server_ip_hint||'';      // v1.5.18：无法获取公网 IP 时的引导提示
  // 单条信息行（label + 值 + 复制按钮）
  // 注意：n.port 是 number、n.host 可能是 undefined，必须 String() 强转后再 .replace，
  // 否则 (number).replace() 抛 TypeError 让整个 forEach 中断，content 卡在「加载中…」
  const row=(label,val,copyVal)=>{
    if(!val)return '';
    const disp=String(val);
    const cp=String(copyVal||val).replace(/`/g,'\\`');
    return `<div class="row" style="margin-bottom:6px">
      <label style="width:110px">${label}</label>
      <div class="f"><code style="word-break:break-all">${disp}</code></div>
      <button class="mut" style="flex-shrink:0;margin:0" onclick="copy(\`${cp}\`)">📋</button>
    </div>`;
  };
  // 一张服务卡（含 URI + QR + 各字段行）
  // v1.5.19：二维码默认隐藏，标题旁加「📱 二维码」按钮，点击弹出浮动展示，点空白关闭
  const card=(title,icon,n,extra='')=>{
    if(!n||!n.uri)return '';  // 未启用/无 URI 不渲染
    const uriCp=n.uri.replace(/`/g,'\\`');
    return `<div class="card"><h3>${icon} ${title}
        <button class="mut" style="margin-left:auto;font-size:12px;padding:4px 10px" onclick="showQR('${title}',\`${uriCp}\`)">📱 二维码</button>
        ${extra}</h3>
      ${row('连接地址',serverIp||n.host||domain)}
      ${row('端口',n.port)}
      ${row('加密方式',n.method)}
      ${row('密码/密钥',n.password)}
      ${row('用户名',n.user)}
      ${row('SNI',n.sni)}
      <div style="border-top:1px solid var(--bd);margin:10px 0"></div>
      <div class="row" style="margin-bottom:6px"><label style="width:110px">完整 URI</label>
        <div class="f"><div class="uri-box">${n.uri}</div></div>
        <button class="mut" style="flex-shrink:0;margin:0" onclick="copy(\`${uriCp}\`)">📋</button></div>
      </div>`;
  };
  let html='';
  // v1.5.18：无法自动获取公网 IP 时（VPC/NAT），顶部显示引导提示横幅
  if(hint){
    html+=`<div class="card" style="background:var(--warn-bg,rgba(255,193,7,.12));border-left:4px solid var(--warn,#ffc107)">
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:18px">⚠️</span>
        <div><strong>连接地址暂无法显示公网 IP</strong><br><span style="font-size:12px;color:var(--mut)">${hint}</span></div>
      </div></div>`;
  }
  // 第一组：按 enabled 过滤显示（v1.5.19 顺序：AnyTLS → NaiveProxy → Shadowsocks → SOCKS5）
  [['AnyTLS','🛡️',j.anytls],['NaiveProxy','🌀',j.naive],['Shadowsocks','🔐',j.ss],['SOCKS5','🧦',j.socks]].forEach(([t,i,n])=>{
    if(n&&n.enabled&&n.uri){html+=card(t,i,n)}
  });
  // 落地服务（启用时显示，标注出口方式）
  if(j.group2_enabled){
    html+='<div class="card"><h3>🛬 落地服务 <span class="tag" style="background:var(--ok);color:#fff">已启用</span></h3>'
      +'<div class="help">落地服务仅 AnyTLS-2 经远端 SS 出口；NaiveProxy 不参与任何落地。</div></div>';
    [['AnyTLS-2','🔀',j.anytls2,'<span class="tag" style="background:var(--ok);color:#fff">出口经 SS 落地</span>']].forEach(([t,i,n,e])=>{
      if(n&&n.uri){html+=card(t,i,n,e)}
    });
  }
  if(!html)html='<div class="card"><div class="mut">当前未启用任何代理服务。请到「服务管理」页安装。</div></div>';
  $('#content').innerHTML=html;
}

// v1.5.19：二维码浮动展示（点击服务名旁「📱 二维码」按钮触发，点空白关闭）
function showQR(title,uri){
  const ov=$('#overlay');
  $('#obox').innerHTML=`<h3>${title} 客户端二维码</h3>
    <div id="qr-float" style="display:flex;justify-content:center;margin:14px 0"></div>
    <div class="uri-box" style="max-width:340px;margin:0 auto;text-align:center">${uri}</div>
    <div style="margin-top:14px"><button class="primary" onclick="copy(\`${uri.replace(/`/g,'\\`')}\`)">📋 复制 URI</button>
    <button class="mut" style="margin-left:8px" onclick="closeOverlay()">关闭</button></div>`;
  ov.style.display='flex';
  // 渲染二维码（延迟到 DOM 插入后）
  setTimeout(()=>{
    const el=document.getElementById('qr-float');
    if(el){el.innerHTML='';try{new QRCode(el,{text:uri,width:200,height:200})}catch(e){}}
  },0);
}
// 覆盖层关闭（点空白 / 点关闭按钮）

  const [d,n]=await Promise.all([api('api/dashboard'),api('api/node')]);

  if(n.error)return $('#content').innerHTML='<div class="card">'+n.error+'</div>';

  const ports=d.ports||{};

    if(!enabled)return '<span class="tag">未安装</span>';
    return active==='active'
      ?'<span class="tag" style="background:var(--ok);color:#fff">已安装·运行中</span>'
      :'<span class="tag" style="background:var(--warn);color:#fff">已安装·未运行</span>';

      <input id="${fieldId}" ${t} value="${val||''}" placeholder="${placeholder}">
      <button class="mut dice" title="随机生成（不自动保存）" onclick="genField('${fieldId}')">🎲</button>
    </div></div>`;
  };
  // 操作行：按可用性自适应。顺序：[应用][启停][重启][装卸][检测]
  // 未安装：仅 [安装]
  // 已安装：[应用] + [启动/停止] + [重启] + [卸载] + [检测]
  const opsRow=(target,enabled,active)=>{
    if(!enabled){

      :`<button class="primary" onclick="svc('${target}','start')">▶️ 启动</button>`;
    return `<div class="ops-row">
      <button class="primary" onclick="svcSave('${target}')">💾 应用</button>
      ${toggleBtn}

      <button class="danger" onclick="svcInstall('${target}','uninstall')">📤 卸载</button>
      <button class="mut" onclick="checkHealth('${target}',this)">🔍 检测</button>
    </div>
    <div id="health-${target}" style="margin-top:6px"></div>`;
  };
  $('#content').innerHTML=`
   <div class="card"><h3>🗂️ 服务管理</h3>
     <div class="help">一站式管理各代理服务：安装/卸载、端口、密钥、启停。修改端口或密钥后点「应用」保存（对应服务自动重启）。🎲 仅生成不保存。落地服务（AnyTLS-2）在「落地服务」页启用后下方显示。</div></div>

   <div class="card">
     <h3>🛡️ AnyTLS ${statusTag(en.anytls,st.anytls)}</h3>
     <div class="row"><label>端口</label><div class="f"><input id="p_anytls" type="number" value="${ports.anytls||''}" placeholder="10000-65535"></div></div>
     ${frow('AnyTLS 密码','k_at_pass',at.password,'任意字符串')}
     ${opsRow('anytls',en.anytls,st.anytls)}
   </div>

   <div class="card">
     <h3>🌀 NaiveProxy ${statusTag(en.naive,st.naive)}</h3>
     <div class="row"><label>端口</label><div class="f"><input id="p_naive" type="number" value="${ports.naive||''}" placeholder="10000-65535"></div></div>
     ${frow('Naive 用户名','k_nv_user',nv.user,'用户名')}
     ${frow('Naive 密码','k_nv_pass',nv.pass,'密码')}
     ${opsRow('naive',en.naive,st.naive)}
   </div>

   <div class="card">
     <h3>🔐 Shadowsocks ${statusTag(en.ss,st.ss)}</h3>
     <div class="row"><label>端口</label><div class="f"><input id="p_ss" type="number" value="${ports.ss||''}" placeholder="10000-65535"></div></div>
     <div class="row"><label>加密方式</label><div class="f"><input id="k_ss_method" value="${ss.method||'2022-blake3-aes-128-gcm'}" placeholder="2022-blake3-aes-128-gcm"></div></div>
     ${frow('SS 密钥','k_ss_key',ss.password,'base64(16字节)密钥')}
     ${opsRow('ss',en.ss,st.ss)}
   </div>

   <div class="card">
     <h3>🧦 SOCKS5 ${statusTag(en.socks,st.socks)}</h3>
     <div class="row"><label>端口</label><div class="f"><input id="p_socks" type="number" value="${ports.socks||''}" placeholder="10000-65535"></div></div>
     ${frow('SOCKS 用户名','k_sk_user',sk.user,'用户名')}
     ${frow('SOCKS 密码','k_sk_pass',sk.pass,'密码')}
     ${opsRow('socks',en.socks,st.socks)}
   </div>

   <div class="card">
     <h3>⚙️ 管理面板 <span class="tag" style="background:${st.panel==='active'?'var(--ok)':'var(--err)'};color:#fff">${st.panel==='active'?'运行中':'未运行'}</span></h3>

     <div class="ops-row">
       <button class="mut" onclick="checkHealth('panel',this)">🔍 检测</button>
    </div>
    <div id="health-panel" style="margin-top:6px"></div>
   </div>`;
}

    const st=enabled?'<span class="tag" style="background:var(--ok);color:#fff">已安装</span>':'<span class="tag">未安装</span>';
    return `<div class="card"><h3>${label} ${st}</h3><div class="mut" style="margin-bottom:10px;font-size:12px">${desc}</div>
      <div class="row"><label>端口</label><div class="f"><code>${port}</code> <span class="mut">（在「端口管理」修改）</span></div></div>
      <div style="margin-top:8px">${enabled?'<button class="danger" onclick="svcInstall(\''+name+'\',\'uninstall\')">卸载</button>':'<button class="primary" onclick="svcInstall(\''+name+'\',\'install\')">安装</button>'}</div>
      <div class="help" style="margin-top:8px">${enabled?'卸载将停止该服务并移除其配置（密钥保留，可重装）。':'安装将生成配置并启动该服务。'}</div></div>`;

    +card('ss','Shadowsocks','sing-box shadowsocks-2022 inbound，加密 2022-blake3-aes-128-gcm。',en.ss,j.ports.ss)
    +card('anytls','AnyTLS','sing-box anytls inbound，TLS 用共享证书。',en.anytls,j.ports.anytls)
    +card('socks','SOCKS5','sing-box socks inbound，强制用户名/密码鉴权。',en.socks,j.ports.socks)
    +card('naive','NaiveProxy','caddy forwardproxy-naive，含域名伪装反代。',en.naive,j.ports.naive);
}
async function svcInstall(name,act){
  const verb=act==='install'?'安装':'卸载';
  if(!confirm(`确认${verb} ${name} 服务？${act==='uninstall'?'该服务将停止，现有连接断开。':''}`))return;
  toast(`正在${verb}…`);
  const j=await api('api/svc-install',{method:'POST',body:JSON.stringify({service:name,action:act})});
  if(j.ok){toast(`${verb}完成`);setTimeout(reloadCurrentTab,500)}
  else toast(j.error||'操作失败');
}
// 刷新当前激活 tab（svcInstall/setPort/saveKey/regen 完成后无差别刷新）
function reloadCurrentTab(){
  const cur=document.querySelector('.nav button.active');
  if(cur&&cur.dataset.t)showTab(cur.dataset.t);
}

// 服务健康检测（v1.5.12）：systemd 状态 + 端口监听 + TCP 握手 三合一诊断
// 结果就近渲染到 #health-<target> 容器内（dashboard / mgmt 页都复用）
async function checkHealth(target,btn){
  const origText=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='🔍 检测中…'}
  const j=await api('api/health',{method:'POST',body:JSON.stringify({target})});
  if(btn){btn.disabled=false;btn.textContent=origText}
  const box=document.getElementById('health-'+target);
  if(!box)return;  // 容器不存在则只 toast
  if(j.error){box.innerHTML=`<div style="color:var(--err);font-size:12px">❌ ${j.error}</div>`;return}
  const line=(ok,label,val)=>`<div style="font-size:12px;line-height:1.7">
    <span style="color:${ok?'var(--ok)':'var(--err)'}">${ok?'✅':'❌'}</span> <b>${label}:</b> ${val}</div>`;
  const allOk=j.enabled&&j.active==='active'&&j.port_listening==='yes'&&j.tcp_connect==='yes';
  box.innerHTML=`<div style="background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:10px;margin-top:8px">
    ${line(j.enabled,'服务状态',j.enabled?'已启用':'未启用')}
    ${j.enabled?line(j.active==='active','进程',''+j.unit+': '+j.active):''}
    ${j.enabled&&j.port?line(j.port_listening==='yes','端口监听',':'+j.port+' '+(j.port_listening==='yes'?'LISTEN':'未监听')):''}
    ${j.enabled&&j.port_listening==='yes'?line(j.tcp_connect==='yes','TCP 握手',(j.tcp_connect==='yes'?'成功 ('+j.tcp_ms+'ms)':'失败')):''}
    <div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--bd);color:${allOk?'var(--ok)':'var(--warn)'}">
      <b>诊断:</b> ${j.summary}
    </div></div>`;
}

async function svc(t,a){
  const verb={restart:'重启',stop:'停止',start:'启动'}[a];
  if(!confirm(`确认${verb} ${t}？${a==='restart'||a==='stop'?'现有连接会断开。':''}`))return;
  toast('正在'+verb+'…');
  const j=await api('api/service',{method:'POST',body:JSON.stringify({target:t,action:a})});
  if(j.ok){toast(verb+'完成');setTimeout(reloadCurrentTab,800)}
  else toast(j.error||'操作失败');
}

async function setPort(t){
  const v=parseInt($('#p_'+t).value);if(!v||v<1||v>65535)return toast('请输入有效端口');
  if(!confirm(`确认把 ${t} 端口改为 ${v}？${t==='panel'?'面板将重启，需用新端口重新登录。':'该协议会重启，现有连接断开。'}`))return;
  const j=await api('api/port',{method:'POST',body:JSON.stringify({target:t,port:v})});
  if(t==='panel'&&j.new_url){showRestartOverlay(j.msg||'面板即将重启',j.new_url,3);return}
  if(j.ok)toast('端口已更新');else toast(j.error||'失败');
}

// base64(n 字节)，与 openssl rand -base64 n 等价（SS2022 密钥格式）
function randB64Bytes(n){
  const b=new Uint8Array(n);
  crypto.getRandomValues(b);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s);
}
// 可读随机串：默认大小写字母+数字，可传 alphabet 限定字符集
function randStr(len,alphabet){
  const A=alphabet||'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const b=new Uint8Array(len);crypto.getRandomValues(b);
  let s='';for(let i=0;i<len;i++)s+=A[b[i]%A.length];
  return s;
}
// 按 input id 在前端生成并回填（不保存，需用户点「应用」）
function genField(id){
  let v='';
  switch(id){
    case 'k_ss_key':    v=randB64Bytes(16);break;                                  // base64(16) SS2022
    case 'k_at_pass':                                                    // AnyTLS 密码
    case 'k_at2_pass':   v=randStr(20);break;                                       // 20 位混合
    case 'k_sk_pass':
    case 'k_nv_pass':    v=randStr(18);break;                                       // 18 位混合
    case 'k_sk_user':
    case 'k_nv_user':    v=randStr(8,'abcdefghijklmnopqrstuvwxyz0123456789');break;  // 8 位小写
    default: return;  // 加密方式等不随机
  }
  const el=document.getElementById(id);
  if(el){el.value=v;el.focus();toast('已生成，需点「应用」保存')}
}
// 保存全部：串行调 portHandler（端口 + 冲突校验 + 重启）+ keyHandler（密钥 + 长度校验 + 异步重启）
// 面板端口（panel）特殊，不走此函数（会断会话，走 setPort + overlay）
async function svcSave(target){
  const lbl={ss:'Shadowsocks',anytls:'AnyTLS',socks:'SOCKS5',naive:'NaiveProxy'}[target]||target;
  if(!confirm(`⚠️ 确认保存 ${lbl} 的全部改动？\n\n端口与密钥将一起更新，对应服务会重启，现有连接断开。`))return;
  toast('正在保存…');
  // 1) 端口（仅在用户实际改动了端口输入框时才发端口请求）
  const portEl=document.getElementById('p_'+target);
  if(portEl){
    const v=parseInt(portEl.value);
    if(v && v>=1 && v<=65535){
      const pr=await api('api/port',{method:'POST',body:JSON.stringify({target,port:v})});
      if(pr.error){toast('端口保存失败: '+pr.error);return}
    }
  }
  // 2) 密钥/凭证（按 target 拼 body）
  let body={target};
  if(target==='ss'){body.method=$('#k_ss_method').value;body.key=$('#k_ss_key').value}
  else if(target==='anytls'){body.pass=$('#k_at_pass').value}
  else if(target==='socks'){body.user=$('#k_sk_user').value;body.pass=$('#k_sk_pass').value}
  else if(target==='naive'){
    // v1.5.23：NaiveProxy 凭证写入 Caddyfile basic_auth，含空格/{} 会破坏语法
    // → caddy 重启失败。前端先拦，后端 keyHandler 也校验（双保险）。
    const nu=$('#k_nv_user').value, np=$('#k_nv_pass').value;
    if(/[ \t\r\n{}]/.test(nu)||/[ \t\r\n{}]/.test(np)){
      toast('NaiveProxy 用户名/密码不能含空格或花括号 {}（会破坏 Caddyfile）');return;
    }
    body.user=nu;body.pass=np;
  }
  else{toast('不支持的目标');return}
  const kr=await api('api/key',{method:'POST',body:JSON.stringify(body)});
  if(kr.error){toast('密钥保存失败: '+kr.error);return}
  toast('已保存，服务正在重启');
  setTimeout(reloadCurrentTab,800);
}

   <div class="help" style="margin-top:12px">当前协议端口 — AnyTLS: ${j.anytls_port} / Naive: ${j.naive_port} / SS: ${j.ss_port} / SOCKS5: ${j.socks_port}（在"端口管理"修改）</div></div>`;

// v1.5.18：主动检测公网 IP（用户点击才外发一次第三方 API，结果填入输入框供确认保存，不直接写配置）
async function detectPublicIP(btn){
  const old=btn.textContent;
  btn.textContent='⏳ 检测中…';btn.disabled=true;
  try{
    const j=await api('api/detect-public-ip');
    if(j.ok&&j.ip){
      const el=$('#s_server_ip');
      if(el){el.value=j.ip;el.focus()}
      toast('检测到公网 IP: '+j.ip+'（需点「💾保存设置」生效）');
    }else{
      toast(j.error||'检测失败');
    }
  }catch(e){toast('检测失败：'+e.message)}
  btn.textContent=old;btn.disabled=false;
}
async function saveSet(){
  // v1.5.22: g() 防御元素缺失（如 --no-caddy 模式下 s_disguise_panel 不渲染），
  // 返回空串而非抛 TypeError 中断整个保存（旧版会在该场景下「点保存无反应」）。
  const g=id=>{const e=$('#s_'+id);return e?e.value:''};
  const body={panel_title:g('panel_title'),url_path:g('url_path'),admin_user:g('admin_user'),session_hours:parseInt(g('session_hours')),panel_port:parseInt(g('panel_port')),login_lock_threshold:parseInt(g('login_lock_threshold')),login_lock_minutes:parseInt(g('login_lock_minutes')),disguise_panel:g('disguise_panel'),disguise_naive:g('disguise_naive'),server_ip:g('server_ip')};
  if(g('admin_pass'))body.admin_pass=g('admin_pass');
  // 只传发生变化的字段由后端处理；这里全传，后端按指针判断（空串/0 会触发改动）
  const j=await api('api/settings',{method:'POST',body:JSON.stringify(body)});
  if(j.ok){
    if(j.new_url){showRestartOverlay(j.msg||'面板即将重启',j.new_url,3);return}
    document.title=body.panel_title||'ANS-GO 管理面板';toast('设置已保存');
  }else toast(j.error||'保存失败');
}

// 日志
function loadLog(){
  $('#content').innerHTML=`<div class="card"><h3>📃 日志查看</h3>
   <div class="row"><label>服务</label><div class="f"><select id="log_svc"><option value="naive">NaiveProxy(caddy)</option><option value="socks">SOCKS5(sing-box)</option><option value="ss">SS/AnyTLS(sing-box)</option><option value="panel">面板(ansgo-panel)</option></select></div>
   <button class="primary" onclick="loadLogData()">刷新</button></div>
   <div class="logs" id="logbox">请选择服务并刷新</div></div>`;
}
async function loadLogData(){
  const s=$('#log_svc').value;$('#logbox').textContent='加载中…';
  const j=await api('api/logs?target='+s+'&n=200');
  $('#logbox').textContent=j.logs||j.error||'(空)';
}

// 自重启覆盖层（倒计时）
function showRestartOverlay(msg,url,sec){
  let n=sec;
  $('#obox').innerHTML=`<h2>🔄 即将重启面板</h2><div style="color:var(--mut);font-size:13px">${msg}</div><div class="count" id="cnt">${n}</div><a href="${url}" style="display:inline-block;margin-top:8px"><button class="primary">立即前往新地址</button></a>`;
  $('#overlay').style.display='flex';
  const t=setInterval(()=>{n--;const e=$('#cnt');if(e)e.textContent=n;if(n<=0){clearInterval(t);location.href=url}},1000);
}

document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('lu').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lp').focus()});
checkAuth();
// 主题切换（localStorage 记忆）
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const b=$('#themeBtn');if(b)b.textContent=t==='light'?'☀️':'🌙'}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')||'dark';const nw=cur==='dark'?'light':'dark';localStorage.setItem('ansgo_theme',nw);applyTheme(nw)}
applyTheme(localStorage.getItem('ansgo_theme')||'dark');
// 恢复侧边栏折叠状态（仅桌面端）
(function(){const v=localStorage.getItem('ansgo_sidebar');if(v==='collapsed'&&!isMobile()){const s=$('#sidebar');s.classList.add('collapsed');$('#collapseIco').textContent='▶';$('#collapseLbl').textContent='展开'}})();
</script>
