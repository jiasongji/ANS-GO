# =============================================================================
# ANS-GO all-in-one 镜像构建推送（ghcr.io）
#
# 触发：
#   1. 手动 workflow_dispatch（可指定 version 输入，如 v1.5.36）
#   2. 推送 v* tag 自动触发（与 release 同步）
#
# 背景（v1.5.36 教训）：v1.5.17~v1.5.35 连续 19 个版本漏传 release 资产/镜像滞后，
# 根因是发版依赖开发机手动三件套（release + 资产 + buildx --push），任何一步遗漏
# 都会让服务器升级拿不到产物。本工作流用仓库自带 GITHUB_TOKEN（packages:write）
# 消除对开发机 ghcr 凭据的依赖，push tag 即自动出镜像。
#
# 双命名空间推送说明：仓库曾用名 jiasongji/ANS-GO（已改名 6667084），存量部署的
# compose 拉取 ghcr.io/jiasongji/ansgo:latest。容器注册表对改名用户的旧路径仍会
# 解析，这里同时推两个命名空间保证存量部署 `docker compose pull` 不断供；新部署
# 的 compose 模板已改为跟随 repository_owner（6667084）。
# =============================================================================
name: docker-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本 tag（如 v1.5.36；留空则取 ref 名）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: 登录 ghcr.io（GITHUB_TOKEN）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算版本号
        id: ver
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME}"
          case "$V" in v*) NV="${V#v}" ;; *) NV="$V" ;; esac
          echo "tag=$V"     >> "$GITHUB_OUTPUT"
          echo "version=$NV" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 all-in-one 镜像（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          # SCRIPTS_BUST 用 commit sha：脚本内容任何变化都强制重建 COPY 层
          #（v1.5.35 教训：buildx 缓存 COPY 层会忽略脚本内容变化）
          build-args: |
            PANEL_VERSION=${{ steps.ver.outputs.version }}
            SCRIPTS_BUST=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ansgo:latest
            ghcr.io/${{ github.repository_owner }}/ansgo:${{ steps.ver.outputs.tag }}
            ghcr.io/jiasongji/ansgo:latest
            ghcr.io/jiasongji/ansgo:${{ steps.ver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
